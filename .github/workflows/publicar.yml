# Publica el juego en GitHub Pages cada vez que se suben cambios a la rama main.
# Si algún test falla (los del motor o los de pantalla), no se publica: la web se queda con la última versión buena.
# En los pull requests solo comprueba (tests, tests de pantalla y compilación), sin publicar.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Tests de pantalla: juegan al juego en un navegador (Chromium), en móvil y en escritorio.
  # Si alguno falla, se guarda un informe con capturas en la pestaña Actions («tests-de-pantalla»).
  pantalla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pantalla
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-de-pantalla
          path: playwright-report/
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, pantalla]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
