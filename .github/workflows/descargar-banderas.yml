# Descarga las banderas de Wikimedia Commons (con licencia y autor) y las guarda en esta rama
# para revisarlas. Solo se ejecuta al subir cambios a la rama banderas-descarga.
name: Descargar banderas

on:
  push:
    branches: [banderas-descarga]
    paths: [scripts/descargar-banderas.py, .github/workflows/descargar-banderas.yml]

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/descargar-banderas.py
      - name: Guardar las banderas (y el registro) en la rama, aunque algo falle
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banderas-wikimedia
          git commit -m "Banderas descargadas de Wikimedia Commons para revisar" || echo "Nada que guardar"
          git push
